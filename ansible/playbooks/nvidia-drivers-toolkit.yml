---
- name: Install NVIDIA Drivers and Container Toolkit
  hosts: gpu_servers
  become: true
  vars:
    linux_distro: "{{ ansible_distribution | lower }}"
    linux_version: "{{ ansible_distribution_version | regex_replace('\\.', '') }}"
    # Auto-detect CUDA repo distro, fallback to ubuntu2204 for unsupported versions
    _detected_repo: "{{ ansible_distribution | lower + ansible_distribution_version | regex_replace('\\.', '') }}"
    cuda_repo_distro: "{{ _cuda_repo_distro | default(_detected_repo if _detected_repo in ['ubuntu2004', 'ubuntu2204', 'ubuntu2404', 'debian11', 'debian12'] else 'ubuntu2204') }}"

  tasks:
    - name: Display detected Linux distribution
      debug:
        msg:
          - "Detected OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Using CUDA repo: {{ cuda_repo_distro }}"

    - name: Verify NVIDIA GPU is present
      command: lspci -nn
      register: lspci_output
      failed_when: "'NVIDIA' not in lspci_output.stdout"
      changed_when: false

    - name: Check if driver is already installed
      command: nvidia-smi
      register: nvidia_smi_check
      failed_when: false
      changed_when: false

    - name: Install NVIDIA drivers
      when: nvidia_smi_check.rc != 0
      block:
        - name: Install prerequisites
          apt:
            name:
              - ubuntu-drivers-common
              - wget
            state: present
            update_cache: true

        - name: Add NVIDIA repository
          get_url:
            url: "https://developer.download.nvidia.com/compute/cuda/repos/{{ cuda_repo_distro }}/x86_64/cuda-keyring_1.0-1_all.deb"
            dest: /tmp/cuda-keyring.deb

        - name: Install NVIDIA repository keyring
          apt:
            deb: /tmp/cuda-keyring.deb

        - name: Install latest NVIDIA driver
          apt:
            name: nvidia-driver-535
            state: present
            update_cache: true

        - name: Reboot to load driver
          reboot:
            msg: "Rebooting to load NVIDIA drivers"
            reboot_timeout: 600

        - name: Verify driver loaded
          command: nvidia-smi
          register: nvidia_verify
          retries: 3
          delay: 10
          until: nvidia_verify.rc == 0

    - name: Setup NVIDIA Container Toolkit
      block:
        - name: Configure toolkit repository
          shell: |
            curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
            curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \
              sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \
              tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
          args:
            creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

        - name: Install NVIDIA Container Toolkit
          apt:
            name: nvidia-container-toolkit
            state: present
            update_cache: true

        - name: Configure Docker runtime
          command: nvidia-ctk runtime configure --runtime=docker

        - name: Restart Docker daemon
          systemd:
            name: docker
            state: restarted

    - name: Test GPU access in container
      command: "docker run --rm --gpus all nvidia/cuda:12.0.0-base-{{ linux_distro }}{{ ansible_distribution_version }} nvidia-smi"
      register: gpu_test
      changed_when: false
      ignore_errors: true

    - name: Installation complete
      debug:
        msg: "NVIDIA drivers and container toolkit installed successfully. GPU accessible in containers."
