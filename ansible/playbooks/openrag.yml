---
- name: Deploy OpenRAG
  hosts: gpu_servers,cpu_servers
  become: true
  vars:
    project_user: "{{ ansible_user | default('ubuntu') }}"
    project_path: "/home/{{ project_user }}/openrag"
    compose_profile: "{{ 'cpu' if inventory_hostname in groups['cpu_servers'] else '' }}"

  tasks:
    - name: Verify Docker is running
      command: docker info
      changed_when: false

    - name: Create project directory
      file:
        path: "{{ project_path }}"
        state: directory
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: "0755"

    - name: Copy docker-compose.yml
      copy:
        src: "{{ playbook_dir }}/../docker-compose.combined.yaml"
        dest: "{{ project_path }}/docker-compose.yaml"
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: "0644"

    - name: Copy .env file if exists
      copy:
        src: "{{ playbook_dir }}/../.env"
        dest: "{{ project_path }}/.env"
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: "0644"
      when: lookup('fileglob', playbook_dir + '/../.env') | length > 0
      ignore_errors: true

    - name: Create required directories
      file:
        path: "{{ project_path }}/{{ item }}"
        state: directory
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: "0755"
      loop:
        - data
        - db
        - logs
        - model_weights
        - vdb/volumes

    - name: Pull and start OpenRAG services
      shell: |
        cd {{ project_path }}
        docker compose --profile "{{ compose_profile }}" pull
        docker compose --profile "{{ compose_profile }}" up -d
      become_user: "{{ project_user }}"

    - name: Wait for services to be healthy
      shell: docker compose -f {{ project_path }}/docker-compose.yaml ps --filter "status=running" | grep -c running || true
      register: running_count
      retries: 10
      delay: 15
      until: running_count.stdout | int > 0
      become_user: "{{ project_user }}"

    - name: Show deployment status
      shell: docker compose -f {{ project_path }}/docker-compose.yaml ps --format "table {{ '{{.Name}}' }}\t{{ '{{.Status}}' }}"
      register: container_status
      become_user: "{{ project_user }}"
      changed_when: false

    - name: Display service information
      debug:
        msg:
          - "{{ container_status.stdout }}"
          - ""
          - "Server Type: {{ 'GPU' if inventory_hostname in groups['gpu_servers'] else 'CPU' }}"
          - "OpenRAG API: http://{{ ansible_default_ipv4.address }}:8080"
          - "Milvus: {{ ansible_default_ipv4.address }}:19530"
